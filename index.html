<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나와 가장 잘 맞는 은퇴 봉사동물 찾기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header with Thumbnail Image -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-3xl mx-auto px-4 py-4">
            <div class="rounded-2xl overflow-hidden shadow-md border border-slate-100 bg-slate-100">
                <img src="image.png" alt="나와 가장 잘 맞는 은퇴 봉사동물 찾기 썸네일" class="w-full h-auto block object-cover">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl w-full mx-auto px-4 py-8 flex-grow flex items-center justify-center">
        
        <!-- Intro Screen -->
        <div id="screen-intro" class="bg-white rounded-2xl shadow-xl p-8 text-center w-full">
            <div class="text-5xl mb-4">🐕‍🦺</div>
            <h2 class="text-xl font-bold mb-3 text-slate-900">국가를 위해 헌신한 영웅들의 안락한 노후를 함께해주세요</h2>
            <p class="text-slate-600 text-sm leading-relaxed mb-6">
                폭발물탐지견, 은퇴 훈련견 등 멋진 활약을 펼친 봉사동물들이 따뜻한 품을 기다리고 있습니다.<br>
                간단한 취향 및 환경 조사를 통해 나와 가장 교감이 잘 될 친구를 추천해 드릴게요!
            </p>
            <button onclick="startQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer w-full md:w-auto">
                매칭 퀴즈 시작하기 ✨
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="screen-quiz" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 w-full hidden">
            <div class="flex justify-between items-center mb-6">
                <span id="question-progress" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">QUESTION 1 / 3</span>
                <span id="progress-percent" class="text-xs font-medium text-slate-400">33%</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
                <div id="bar" class="bg-emerald-600 h-full transition-all duration-300" style="width: 33%;"></div>
            </div>

            <h3 id="question-title" class="text-lg md:text-xl font-bold text-slate-900 mb-6">질문 내용이 들어갑니다.</h3>
            
            <div id="options-container" class="space-y-3">
                <!-- Options dynamically inserted -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="screen-result" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 w-full hidden">
            <div class="text-center mb-6">
                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">✨ 환상의 궁합 매칭 완료!</span>
                <h2 class="text-xl md:text-2xl font-bold text-slate-900 mt-2">회원님과 가장 잘 어울리는 영웅 동물은?</h2>
            </div>

            <div id="result-card" class="bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200 rounded-2xl p-6 mb-6">
                <!-- Result details dynamically inserted -->
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="restartQuiz()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl transition duration-200 cursor-pointer">
                    다시 테스트하기 🔄
                </button>
                <button onclick="alert('입양 신청(모의) 기능이 접수되었습니다! 농림축산검역본부 봉사동물 담당 부서로 문의바랍니다.')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200 cursor-pointer">
                    입양 문의 / 신청하기 💌
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        <p>출처: 농림축산식품부 농림축산검역본부 봉사동물 입양 정보 목록 (2026)</p>
    </footer>
